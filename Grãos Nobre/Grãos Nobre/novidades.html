<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidade do Grão-Nobre</title>
    <link rel="stylesheet" href="cafe.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url(fundo-de-cafe-desenhado-a-mao_23-2150849907.jpg) no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.3);
        }

        .container h1 {
            color: #6b4226;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }

        .container img {
            max-width: 300px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn-voltar {
            display: inline-block;
            padding: 10px 20px;
            background: #6b4226;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-voltar:hover {
            background: #a0522d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍰 Novidades 🍰</h1>
        <p>Veja as novidades que estão por vir</p>
        <img src="cenoura.png" alt="Bolo de Cenoura">
        <br>
        <a href="cafe.html" class="btn-voltar">⬅ Voltar ao Início</a>
    </div>
</body>
</html>
