<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Grão-Nobre</title>
    <link rel="stylesheet" href="cafe.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url(fundo2.jpg) no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            padding: 20px;
        }

        header h1 {
            color: #fff;
            margin: 0;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #contato {
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 40px 20px;
        }

        #contato h2 {
            color: #6b4226;
            margin-bottom: 20px;
        }

        #contato p {
            margin: 10px 0;
            color: #333;
        }

        form {
            margin-top: 20px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #6b4226;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
        }

        textarea {
            resize: none;
        }

        input[type="submit"] {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #6b4226;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="submit"]:hover {
            background: #a0522d;
        }

        .botao-voltar {
            margin: 20px 0;
        }

        .botao-voltar a {
            display: inline-block;
            padding: 10px 20px;
            background: #6b4226;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .botao-voltar a:hover {
            background: #a0522d;
        }

        footer {
            width: 100%;
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>📩 Contato - Grão-Nobre</h1>
    </header>

    <main>
        <section id="contato">
            <h2>Entre em Contato</h2>
            <p>Email: <a href="mailto:nobregrao33@gmail.com">nobregrao33@gmail.com</a></p>
            <p>Telefone: (16) 93948-5678</p>
            <p>Endereço: Rua das Flores, 123 - São Paulo/SP</p>

            <form action="mailto:nobregrao33@gmail.com" method="post" enctype="text/plain">
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="4" required></textarea><br><br>

                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>

    <div class="botao-voltar">
        <a href="cafe.html">⬅ Voltar para o Início</a>
    </div>

    <footer>
        <p>&copy; 2025 Grão-Nobre - todos os direitos reservados</p>
    </footer>
</body>
</html>
